<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1950" viewBox="0 0 1440 1950" role="img" aria-labelledby="title desc">
<title id="title">Altoids MP3 — Revision 1 wiring map</title>
<desc id="desc">Logical map of supplied prototype connections. Battery through charger battery terminals and switch to a five volt converter; KB2040 TX through one kiloohm to DFPlayer RX, RX to TX; I2C display at 3.3 volts; right D2, up D3, down D4, left D5; DAC left to tip and right to ring. Grounds shared. Button returns and exact power module details remain unconfirmed.</desc>
